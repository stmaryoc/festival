<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Satellite parking lot placeholder</title>
  <desc id="desc">A placeholder map-style visual with highlighted parking and shuttle zones.</desc>
  <rect width="1200" height="760" fill="#d6ddd8" />
  <rect x="60" y="60" width="1080" height="640" rx="20" fill="#b5c2b2" />
  <rect x="120" y="150" width="360" height="210" rx="16" fill="#8ea28e" />
  <rect x="530" y="120" width="570" height="240" rx="18" fill="#7a8f79" />
  <rect x="160" y="430" width="930" height="200" rx="16" fill="#95a593" />
  <rect x="510" y="400" width="120" height="260" fill="#f2efe9" />
  <rect x="690" y="80" width="70" height="590" fill="#f2efe9" />

  <rect x="175" y="185" width="260" height="145" rx="14" fill="none" stroke="#9f2236" stroke-width="8" />
  <rect x="560" y="155" width="430" height="160" rx="14" fill="none" stroke="#9f2236" stroke-width="8" />
  <rect x="240" y="465" width="770" height="130" rx="14" fill="none" stroke="#9f2236" stroke-width="8" />

  <rect x="168" y="94" width="238" height="58" rx="10" fill="#f7fafc" />
  <text x="186" y="130" font-size="30" font-family="Source Sans 3, sans-serif" fill="#2b3742">A: Shuttle Drop-Off</text>
  <rect x="510" y="88" width="208" height="58" rx="10" fill="#f7fafc" />
  <text x="528" y="125" font-size="30" font-family="Source Sans 3, sans-serif" fill="#2b3742">B: Main Parking</text>
  <rect x="840" y="620" width="268" height="58" rx="10" fill="#f7fafc" />
  <text x="858" y="656" font-size="30" font-family="Source Sans 3, sans-serif" fill="#2b3742">C: Overflow Parking</text>
</svg>
